<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Dusk Duel: a 2D fighting game with rollback netcode, online play, replays, real frame data and a training mode." />
    <meta name="theme-color" content="#140d1c" />
    <title>Dusk Duel: a 2D fighting game with rollback netcode</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main id="game">
      <canvas aria-label="The fight"></canvas>
      <div id="ui"></div>
      <div class="loading" role="status">
        <h1 class="logo">Dusk <span>Duel</span></h1>
        <div class="loading-bar"><span></span></div>
        <p class="loading-label">Loading…</p>
      </div>
    </main>
    <noscript>This game needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
