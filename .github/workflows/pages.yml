# Tests, builds and deploys the game to GitHub Pages.
#
#   every push and pull request: type check + unit tests, including the
#   server's security tests and the netplay harness (Ubuntu and Windows),
#   a dependency audit, then a build and the Playwright tests in headless
#   Chromium (online tests run two browsers against a local server).
#   pushes to master: the build is published to GitHub Pages.
#
# One-time setup (see the README): Settings > Pages > Source: "GitHub Actions",
# and the repository variable GAME_SERVER_URL (Settings > Secrets and
# variables > Actions > Variables) set to the Render service's https URL.
# Without it the site builds and everything but online play works.
# The site is https://rdbagwell.github.io/Fighting-Game/ (the build uses
# relative paths, so a rename only changes the URL; see site.config.js).
name: Test, build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # All dependencies, dev tools included: the Vite dev server runs on
      # contributors' machines, so its advisories matter too.
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high

  build:
    needs: test
    # Pinned: Playwright 1.56 can't install Chromium on ubuntu-latest
    # (Ubuntu 26.04). Move to ubuntu-latest when Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
      - run: npm run build:e2e
      - name: Smoke tests (Playwright, headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --grep-invert @screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
